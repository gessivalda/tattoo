<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos - Studio Tattoo</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Playfair+Display:wght@600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .agendamentos-container {
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      padding: 20px 0;
    }

    .header-section {
      background: var(--card);
      padding: 20px;
      border-radius: var(--radius);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin: 0;
    }

    .logout-btn {
      background: var(--accent);
      color: var(--white);
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .logout-btn:hover {
      background: var(--muted);
      color: var(--white);
    }

    .table-container {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .table {
      color: var(--white);
    }

    .table th {
      background: var(--accent);
      color: var(--white);
      border: none;
      font-weight: 600;
    }

    .table td {
      border-color: var(--muted);
      vertical-align: middle;
    }

    .btn-action {
      padding: 5px 10px;
      margin: 0 2px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-edit {
      background: #28a745;
      color: white;
    }

    .btn-edit:hover {
      background: #218838;
    }

    .btn-delete {
      background: #dc3545;
      color: white;
    }

    .btn-delete:hover {
      background: #c82333;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }

    .error {
      background: #dc3545;
      color: white;
      padding: 15px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }

    .session-expired {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ffc107;
      color: #000;
      padding: 15px;
      border-radius: var(--radius);
      z-index: 1000;
    }
  </style>
</head>

<body>
  <div class="agendamentos-container">
    <div class="container">
      
      <div class="header-section">
        <h1>Agendamentos</h1>
        <button class="logout-btn" onclick="logout()">Sair</button>
      </div>

      <div id="errorMessage" class="error" style="display: none;"></div>
      
      <div class="table-container">
        <div id="loadingMessage" class="loading">
          Carregando agendamentos...
        </div>
        
        <div id="tableContainer" style="display: none;">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Tatuador</th>
                <th>Cliente</th>
                <th>Data do Agendamento</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="agendamentosTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Verificar autenticação ao carregar a página
    function checkAuthentication() {
      const token = localStorage.getItem('authToken');
      const expiresIn = localStorage.getItem('expiresIn');
      const loginTime = localStorage.getItem('loginTime');
      
      if (!token || !expiresIn || !loginTime) {
        redirectToLogin();
        return false;
      }
      
      const currentTime = Date.now();
      const sessionDuration = parseInt(expiresIn) * 1000;
      const elapsedTime = currentTime - parseInt(loginTime);
      
      if (elapsedTime >= sessionDuration) {
        showSessionExpiredMessage();
        clearSession();
        setTimeout(() => {
          redirectToLogin();
        }, 3000);
        return false;
      }
      
      return true;
    }

    function redirectToLogin() {
      window.location.href = 'index.html#logar';
    }

    function clearSession() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('expiresIn');
      localStorage.removeItem('loginTime');
    }

    function showSessionExpiredMessage() {
      const message = document.createElement('div');
      message.className = 'session-expired';
      message.textContent = 'Sessão expirada. Redirecionando para login...';
      document.body.appendChild(message);
    }

    function logout() {
      clearSession();
      redirectToLogin();
    }

    // Carregar agendamentos
    async function carregarAgendamentos() {
      if (!checkAuthentication()) {
        return;
      }

      const token = localStorage.getItem('authToken');
      
      try {
        const response = await fetch('http://localhost:8080/tattoos', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            showSessionExpiredMessage();
            clearSession();
            setTimeout(() => {
              redirectToLogin();
            }, 3000);
            return;
          }
          throw new Error('Erro ao carregar agendamentos');
        }

        const agendamentos = await response.json();
        displayAgendamentos(agendamentos);
        
      } catch (error) {
        console.error('Error:', error);
        showError('Erro ao carregar agendamentos: ' + error.message);
      }
    }

    function displayAgendamentos(agendamentos) {
      const loadingMessage = document.getElementById('loadingMessage');
      const tableContainer = document.getElementById('tableContainer');
      const tableBody = document.getElementById('agendamentosTableBody');
      console.log('Agendamentos recebidos:', agendamentos);
      loadingMessage.style.display = 'none';
      tableContainer.style.display = 'block';
      
      tableBody.innerHTML = '';
      
      if (agendamentos.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3" class="text-center">Nenhum agendamento encontrado</td></tr>';
        return;
      }
      
      agendamentos.forEach(agendamento => {
        const schedules = agendamento.schedules || [];
        schedules.forEach((schedule, index) => {
          console.log(agendamento.name)
          console.log('Schedule:', schedule, 'Index:', index);
          // Alternativa sem usar Date()
        const [ano, mes, dia] = schedule.date.split('-');
        const dataFormatada = `${dia}/${mes}/${ano}`;

          const row = document.createElement('tr');
          row.innerHTML = `
           <td>${agendamento.name }</td>
            <td>${schedule.clientName || 'Nome não informado'}</td>
            <td>${dataFormatada}</td>
            <td>
              <button class="btn-action btn-edit" onclick="editarAgendamento(${agendamento.id}, '${index}')">
                Editar
              </button>
              <button class="btn-action btn-delete" onclick="deletarAgendamento(${agendamento.id}, '${index}')">
                Deletar
              </button>
            </td>
          `;
          
          tableBody.appendChild(row);
        });
      });
    }    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    function showSuccess(message) {
      // Criar elemento de sucesso se não existir
      let successDiv = document.getElementById('successMessage');
      if (!successDiv) {
        successDiv = document.createElement('div');
        successDiv.id = 'successMessage';
        successDiv.className = 'success';
        successDiv.style.cssText = `
          background: #28a745;
          color: white;
          padding: 15px;
          border-radius: var(--radius);
          margin-bottom: 20px;
          display: none;
        `;
        document.getElementById('errorMessage').parentNode.insertBefore(successDiv, document.getElementById('errorMessage').nextSibling);
      }
      
      successDiv.textContent = message;
      successDiv.style.display = 'block';
      
      setTimeout(() => {
        successDiv.style.display = 'none';
      }, 5000);
    }    // Função para abrir modal de edição
    function abrirModalEdicao(id, nomeAtual, dataAtual) {
      const modal = document.createElement('div');
      modal.className = 'modal-erro';
      modal.innerHTML = `
        <div class="modal-conteudo">
          <div class="modal-header">
            <h2>Editar Agendamento</h2>
            <button class="modal-fechar">&times;</button>
          </div>
          <div class="modal-body">
            <label for="editClientName">Nome do cliente:</label>
            <input type="text" id="editClientName" value="${nomeAtual || ''}" class="form-control" minlength="2" maxlength="150" required>
            <div class="invalid-feedback" id="editClientNameError"></div>
            <br>
            <label for="editDataAgendamento">Data do agendamento:</label>
            <input type="date" id="editDataAgendamento" value="${dataAtual || ''}" class="form-control" required>
            <div class="invalid-feedback" id="editDataError"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-fechar-modal" id="cancelarEdicao">Cancelar</button>
            <button type="button" class="btn btn-primary" id="confirmarEdicao">Alterar</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      // Configurar data mínima como hoje
      const today = new Date().toISOString().split('T')[0];
      const dateInput = modal.querySelector('#editDataAgendamento');
      dateInput.setAttribute('min', today);

      // Event listeners para fechar modal
      const fecharBtn = modal.querySelector('.modal-fechar');
      const cancelarBtn = modal.querySelector('#cancelarEdicao');
      
      fecharBtn?.addEventListener('click', () => modal.remove());
      cancelarBtn?.addEventListener('click', () => modal.remove());

      // Event listener para confirmar edição
      const confirmarBtn = modal.querySelector('#confirmarEdicao');
      const clientNameInput = modal.querySelector('#editClientName');
      const dataInput = modal.querySelector('#editDataAgendamento');
      const clientNameError = modal.querySelector('#editClientNameError');
      const dataError = modal.querySelector('#editDataError');

      // Validação em tempo real
      function validateForm() {
        const clientName = clientNameInput.value.trim();
        const data = dataInput.value;
        let isValid = true;

        // Validar nome
        if (clientName.length < 2) {
          clientNameError.textContent = 'Nome deve ter pelo menos 2 caracteres';
          clientNameError.style.display = 'block';
          clientNameInput.classList.add('is-invalid');
          isValid = false;
        } else {
          clientNameError.style.display = 'none';
          clientNameInput.classList.remove('is-invalid');
        }

        // Validar data
        if (!data) {
          dataError.textContent = 'Data é obrigatória';
          dataError.style.display = 'block';
          dataInput.classList.add('is-invalid');
          isValid = false;
        } else {
          dataError.style.display = 'none';
          dataInput.classList.remove('is-invalid');
        }

        // Habilitar/desabilitar botão
        confirmarBtn.disabled = !isValid;
        confirmarBtn.style.backgroundColor = isValid ? '' : 'gray';
        confirmarBtn.style.cursor = isValid ? 'pointer' : 'not-allowed';

        return isValid;
      }

      clientNameInput.addEventListener('input', validateForm);
      dataInput.addEventListener('change', validateForm);

      // Validação inicial
      validateForm();

      confirmarBtn.addEventListener('click', async () => {
        if (validateForm()) {
          const novoNome = clientNameInput.value.trim();
          const novaData = dataInput.value;
          
          modal.remove();
          await executarEdicaoAgendamento(id, dataAtual, nomeAtual, novaData, novoNome);
        }
      });
    }

    // Função para executar a edição do agendamento
    async function executarEdicaoAgendamento(id, dataAtual, nomeAtual, novaData, novoNome) {
      const token = localStorage.getItem('authToken');
      
      try {
        const response = await fetch('http://localhost:8080/tattoos/schedule', {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            id: id,
            currentDate: dataAtual,
            currentClientName: nomeAtual,
            newDate: novaData,
            newClientName: novoNome
          })
        });

        if (!response.ok) {
          if (response.status === 401) {
            showSessionExpiredMessage();
            clearSession();
            setTimeout(() => {
              redirectToLogin();
            }, 3000);
            return;
          }
          throw new Error('Erro ao editar agendamento');
        }

        showSuccess('Agendamento editado com sucesso!');
        carregarAgendamentos();
        
      } catch (error) {
        console.error('Error:', error);
        showError('Erro ao editar agendamento: ' + error.message);
      }
    }

    async function editarAgendamento(id, index) {
      // Buscar dados atuais do agendamento
      const agendamentos = await buscarAgendamentos();
      console.log(agendamentos)
      let agendamentoAtual = null;
      let scheduleAtual = null;
      let listDate = []
      
      // Encontrar o agendamento e schedule específicos
      for (const agendamento of agendamentos) {
        if (agendamento.id === id) {
                listDate.push(agendamento.schedules[index].date)
                          console.log(listDate)
configurarCalendario(listDate, '#editDataAgendamento');
          agendamentoAtual = agendamento;
          if (agendamento.schedules && agendamento.schedules.length > 0 ) {
            scheduleAtual =   agendamento.schedules[index]; // Pega o schedule no índice especificado
          }
          break;
        }
      }
      
      if (!agendamentoAtual || !scheduleAtual) {
        showError('Agendamento não encontrado');
        return;
      }
      
      // Abrir modal de edição
      console.log(scheduleAtual)
      abrirModalEdicao(id, scheduleAtual.clientName, scheduleAtual.date);
    }

    // Função auxiliar para buscar agendamentos
    async function buscarAgendamentos() {
      const token = localStorage.getItem('authToken');
      
      try {
        const response = await fetch('http://localhost:8080/tattoos', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error('Erro ao buscar agendamentos');
        }

        return await response.json();
      } catch (error) {
        console.error('Error:', error);
        return [];
      }
    }  
    
      function configurarCalendario(datasAgendadas, selector) {
            console.log('Datas agendadas para configurar o calendário:', datasAgendadas);
            const dateInput = document.querySelector(selector);

            if (dateInput) {
                const today = new Date();

                flatpickr.localize(flatpickr.l10ns.pt); // Configura o idioma para português

                flatpickr(dateInput, {
                    disable: [
                        function (date) {
                            // Bloqueia datas menores que hoje
                            return date < today;
                        },
                        ...datasAgendadas.map(data => {
                            return new Date(data + 'T00:00:00'); // Garante que a data correta seja bloqueada
                        })
                    ],
                    dateFormat: 'd/m/Y', // Formato de data em português
                    onDayCreate: function(dObj, dStr, fp, dayElem) {
                        const disabledDates = datasAgendadas.map(data => new Date(data + 'T00:00:00').toDateString());
                        const dayDate = new Date(dayElem.dateObj).toDateString();

                        if (disabledDates.includes(dayDate)) {
                            dayElem.style.color = 'red'; // Pinta somente o número do dia de vermelho
                            dayElem.style.pointerEvents = 'none'; // Remove a possibilidade de clicar
                        } else if (new Date(dayElem.dateObj) < today) {
                            dayElem.style.color = 'red'; // Define o texto vermelho para datas menores que hoje
                            dayElem.style.pointerEvents = 'none'; // Remove a possibilidade de clicar
                        }
                    }
                });
            }
        }
// Função para abrir modal de confirmação de deleção
    function abrirModalDelecao(id, nomeCliente, dataAgendamento) {
      const modal = document.createElement('div');
      modal.className = 'modal-erro';
      
      // Formatar data para exibição
      const [ano, mes, dia] = dataAgendamento.split('-');
      const dataFormatada = `${dia}/${mes}/${ano}`;
      
      modal.innerHTML = `
        <div class="modal-conteudo">
          <div class="modal-header">
            <h2>Confirmar Deleção</h2>
            <button class="modal-fechar">&times;</button>
          </div>
          <div class="modal-body">
            <p>Tem certeza que deseja deletar este agendamento?</p>
            <br>
            <div style="background: rgba(220, 53, 69, 0.1); padding: 15px; border-radius: 6px; border-left: 4px solid #dc3545;">
              <strong>Dados do agendamento:</strong><br>
              <strong>Cliente:</strong> ${nomeCliente}<br>
              <strong>Data:</strong> ${dataFormatada}
            </div>
            <br>
            <p style="color: #dc3545; font-weight: 600;">⚠️ Esta ação não pode ser desfeita!</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-fechar-modal" id="cancelarDelecao">Cancelar</button>
            <button type="button" class="btn btn-danger" id="confirmarDelecao" style="background: #dc3545; color: white;">Deletar</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      // Event listeners para fechar modal
      const fecharBtn = modal.querySelector('.modal-fechar');
      const cancelarBtn = modal.querySelector('#cancelarDelecao');
      
      fecharBtn?.addEventListener('click', () => modal.remove());
      cancelarBtn?.addEventListener('click', () => modal.remove());

      // Event listener para confirmar deleção
      const confirmarBtn = modal.querySelector('#confirmarDelecao');
      
      confirmarBtn.addEventListener('click', async () => {
        modal.remove();
        await executarDelecaoAgendamento(id, dataAgendamento, nomeCliente);
      });
    }

    // Função para executar a deleção do agendamento
    async function executarDelecaoAgendamento(id, dataAgendamento, nomeCliente) {
      const token = localStorage.getItem('authToken');
      
      try {
        const response = await fetch('http://localhost:8080/tattoos/schedule', {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            id: id,
            date: dataAgendamento,
            clientName: nomeCliente
          })
        });

        if (!response.ok) {
          if (response.status === 401) {
            showSessionExpiredMessage();
            clearSession();
            setTimeout(() => {
              redirectToLogin();
            }, 3000);
            return;
          }
          throw new Error('Erro ao deletar agendamento');
        }

        showSuccess('Agendamento deletado com sucesso!');
        carregarAgendamentos();
        
      } catch (error) {
        console.error('Error:', error);
        showError('Erro ao deletar agendamento: ' + error.message);
      }
    }

    async function deletarAgendamento(id, index) {
      // Buscar dados atuais do agendamento para obter date e clientName
      const agendamentos = await buscarAgendamentos(); 
      let agendamentoAtual = null;
      let scheduleAtual = null;
      
      // Encontrar o agendamento e schedule específicos
      for (const agendamento of agendamentos) {
        if (agendamento.id === id) {
          agendamentoAtual = agendamento;
          if (agendamento.schedules && agendamento.schedules.length > 0) {
            scheduleAtual = agendamento.schedules[index]; // Pega o schedule no índice especificado
          }
          break;
        }
      }
      
      if (!agendamentoAtual || !scheduleAtual) {
        showError('Agendamento não encontrado');
        return;
      }

      // Abrir modal de confirmação de deleção
      abrirModalDelecao(id, scheduleAtual.clientName, scheduleAtual.date);
    }

    // Verificar sessão periodicamente
    setInterval(() => {
      if (!checkAuthentication()) {
        return;
      }
    }, 60000); // Verificar a cada minuto

    // Carregar agendamentos ao inicializar a página
    window.addEventListener('load', () => {
      if (checkAuthentication()) {
        carregarAgendamentos();
      }
    });
  </script>
</body>

</html>
