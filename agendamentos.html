<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos - Studio Tattoo</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Playfair+Display:wght@600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .agendamentos-container {
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      padding: 20px 0;
    }

    .header-section {
      background: var(--card);
      padding: 20px;
      border-radius: var(--radius);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin: 0;
    }

    .logout-btn {
      background: var(--accent);
      color: var(--white);
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .logout-btn:hover {
      background: var(--muted);
      color: var(--white);
    }

    .table-container {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .table {
      color: var(--white);
    }

    .table th {
      background: var(--accent);
      color: var(--white);
      border: none;
      font-weight: 600;
    }

    .table td {
      border-color: var(--muted);
      vertical-align: middle;
    }

    .btn-action {
      padding: 5px 10px;
      margin: 0 2px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-edit {
      background: #28a745;
      color: white;
    }

    .btn-edit:hover {
      background: #218838;
    }

    .btn-delete {
      background: #dc3545;
      color: white;
    }

    .btn-delete:hover {
      background: #c82333;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }

    .error {
      background: #dc3545;
      color: white;
      padding: 15px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }

    .session-expired {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ffc107;
      color: #000;
      padding: 15px;
      border-radius: var(--radius);
      z-index: 1000;
    }
  </style>
</head>

<body>
  <div class="agendamentos-container">
    <div class="container">
      
      <div class="header-section">
        <h1>Agendamentos</h1>
        <button class="logout-btn" onclick="logout()">Sair</button>
      </div>

      <div id="errorMessage" class="error" style="display: none;"></div>
      
      <div class="table-container">
        <div id="loadingMessage" class="loading">
          Carregando agendamentos...
        </div>
        
        <div id="tableContainer" style="display: none;">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Nome do Cliente</th>
                <th>Data do Agendamento</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="agendamentosTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Verificar autenticação ao carregar a página
    function checkAuthentication() {
      const token = localStorage.getItem('authToken');
      const expiresIn = localStorage.getItem('expiresIn');
      const loginTime = localStorage.getItem('loginTime');
      
      if (!token || !expiresIn || !loginTime) {
        redirectToLogin();
        return false;
      }
      
      const currentTime = Date.now();
      const sessionDuration = parseInt(expiresIn) * 1000;
      const elapsedTime = currentTime - parseInt(loginTime);
      
      if (elapsedTime >= sessionDuration) {
        showSessionExpiredMessage();
        clearSession();
        setTimeout(() => {
          redirectToLogin();
        }, 3000);
        return false;
      }
      
      return true;
    }

    function redirectToLogin() {
      window.location.href = 'index.html#logar';
    }

    function clearSession() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('expiresIn');
      localStorage.removeItem('loginTime');
    }

    function showSessionExpiredMessage() {
      const message = document.createElement('div');
      message.className = 'session-expired';
      message.textContent = 'Sessão expirada. Redirecionando para login...';
      document.body.appendChild(message);
    }

    function logout() {
      clearSession();
      redirectToLogin();
    }

    // Carregar agendamentos
    async function carregarAgendamentos() {
      if (!checkAuthentication()) {
        return;
      }

      const token = localStorage.getItem('authToken');
      
      try {
        const response = await fetch('http://localhost:8080/tattoos', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            showSessionExpiredMessage();
            clearSession();
            setTimeout(() => {
              redirectToLogin();
            }, 3000);
            return;
          }
          throw new Error('Erro ao carregar agendamentos');
        }

        const agendamentos = await response.json();
        displayAgendamentos(agendamentos);
        
      } catch (error) {
        console.error('Error:', error);
        showError('Erro ao carregar agendamentos: ' + error.message);
      }
    }

    function displayAgendamentos(agendamentos) {
      const loadingMessage = document.getElementById('loadingMessage');
      const tableContainer = document.getElementById('tableContainer');
      const tableBody = document.getElementById('agendamentosTableBody');
      console.log('Agendamentos recebidos:', agendamentos);
      loadingMessage.style.display = 'none';
      tableContainer.style.display = 'block';
      
      tableBody.innerHTML = '';
      
      if (agendamentos.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3" class="text-center">Nenhum agendamento encontrado</td></tr>';
        return;
      }
      
      agendamentos.forEach(agendamento => {
        const schedules = agendamento.schedules || [];
        schedules.forEach(schedule => {
          console.log('Schedule:', schedule);
          // Alternativa sem usar Date()
        const [ano, mes, dia] = schedule.date.split('-');
        const dataFormatada = `${dia}/${mes}/${ano}`;

          
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${schedule.clientName || 'Nome não informado'}</td>
            <td>${dataFormatada}</td>
            <td>
              <button class="btn-action btn-edit" onclick="editarAgendamento(${agendamento.id})">
                Editar
              </button>
              <button class="btn-action btn-delete" onclick="deletarAgendamento(${agendamento.id})">
                Deletar
              </button>
            </td>
          `;
          
          tableBody.appendChild(row);
        });
      });
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    function editarAgendamento(id) {
      // Implementar edição
      alert(`Editar agendamento ID: ${id}`);
      // Aqui você pode implementar um modal ou redirecionar para uma página de edição
    }

    async function deletarAgendamento(id) {
      if (!confirm('Tem certeza que deseja deletar este agendamento?')) {
        return;
      }

      const token = localStorage.getItem('authToken');
      
      try {
        const response = await fetch(`http://localhost:8080/tattoos/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            showSessionExpiredMessage();
            clearSession();
            setTimeout(() => {
              redirectToLogin();
            }, 3000);
            return;
          }
          throw new Error('Erro ao deletar agendamento');
        }

        // Recarregar a lista após deletar
        carregarAgendamentos();
        
      } catch (error) {
        console.error('Error:', error);
        showError('Erro ao deletar agendamento: ' + error.message);
      }
    }

    // Verificar sessão periodicamente
    setInterval(() => {
      if (!checkAuthentication()) {
        return;
      }
    }, 60000); // Verificar a cada minuto

    // Carregar agendamentos ao inicializar a página
    window.addEventListener('load', () => {
      if (checkAuthentication()) {
        carregarAgendamentos();
      }
    });
  </script>
</body>

</html>
